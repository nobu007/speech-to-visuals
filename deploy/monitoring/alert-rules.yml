# Speech-to-Visuals Prometheus Alerting Rules
# Generated by alert-rules.ts (REQ-209)
#
# Usage:
#   Copy this file to your Prometheus rules directory (e.g., /etc/prometheus/rules/)
#   or mount it as a ConfigMap in Kubernetes:
#     kubectl create configmap s2v-alert-rules --from-file=alert-rules.yml
#
# Reload Prometheus after installation to pick up the new rules.

groups:
  - name: speech-to-visuals-alerts
    interval: 30s
    rules:
      - alert: SpeechToVisualsHighErrorRate
        expr: rate(http_errors_total[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "HTTP error rate exceeds threshold"
          description: "Error rate is above 5.0% (current: {{ $value | humanizePercentage }}). Check /api/v1/monitoring/error-recovery for recovery telemetry."
          runbook_url: "docs/runbooks/high-error-rate.md"

      - alert: SpeechToVisualsHighLatencyP95
        expr: http_request_duration_ms{quantile="0.95"} > 20000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "P95 latency exceeds threshold"
          description: "P95 request latency is above 20s (current: {{ $value }}ms). Check /api/v1/monitoring/http-metrics for per-route breakdown."
          runbook_url: "docs/runbooks/high-latency.md"

      - alert: SpeechToVisualsHealthCheckFailures
        expr: sum(increase(http_errors_total{path=~"/health.*"}[10m])) >= 3
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Health check endpoint returning errors"
          description: "Health check endpoints have returned 3+ errors in the last 10 minutes. The system may be unhealthy. Check /health for component-level status."
          runbook_url: "docs/runbooks/health-check-failures.md"

      - alert: SpeechToVisualsLLMBudgetOverage
        expr: http_slow_requests_total > 0 and on() process_uptime_ms > 3600000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "LLM budget utilization approaching limit"
          description: "LLM API cost is approaching the configured budget limit. Check /api/v1/monitoring/cost for detailed cost breakdown and token usage."
          runbook_url: "docs/runbooks/llm-budget-overage.md"

      - alert: SpeechToVisualsExportQueueBacklog
        expr: export_queue_size > 50
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Export queue backlog exceeds threshold"
          description: "Export queue has more than 50 jobs waiting (current: {{ $value }}). Check /api/v1/export/jobs for queue details and consider scaling concurrency."
          runbook_url: "docs/runbooks/export-queue-backlog.md"

      - alert: SpeechToVisualsExportQueueSlowWait
        expr: export_queue_wait_time_ms > 10000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Export queue wait time exceeds threshold"
          description: "Average export job queue wait time is above 10s (current: {{ $value }}ms). Check /api/v1/export/jobs for active jobs and processing status."
          runbook_url: "docs/runbooks/export-queue-slow-wait.md"

      - alert: SpeechToVisualsExportQueueCriticalBacklog
        expr: export_queue_size > 100
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Export queue backlog at critical level"
          description: "Export queue has more than 100 jobs waiting (current: {{ $value }}). The system is severely backed up. Immediate intervention required — check /api/v1/export/jobs and scale processing concurrency."
          runbook_url: "docs/runbooks/export-queue-backlog.md"

      - alert: SpeechToVisualsExportDeadLetterQueueGrowth
        expr: export_queue_dlq_size > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Export dead letter queue has jobs"
          description: "Export dead letter queue has {{ $value }} job(s) that failed after exhausting all retries. Check /api/v1/export/jobs/dead-letter for details and consider replaying after fixing root cause."
          runbook_url: "docs/runbooks/export-queue-backlog.md"

      - alert: SpeechToVisualsExportDLQReplayRate
        expr: rate(export_queue_dlq_replay_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Export DLQ replay rate is high"
          description: "Dead-lettered export jobs are being replayed at a rate above 0.1/s. Frequent replays indicate recurring failures that require investigation."
          runbook_url: "docs/runbooks/export-queue-backlog.md"

      - alert: SpeechToVisualsExportHighRetryRate
        expr: rate(export_queue_retry_total[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Export job retry rate is high"
          description: "Export jobs are retrying at a rate above 0.5/min (current: {{ $value }}/s). This indicates a systemic issue with export processing. Check /api/v1/export/jobs for active jobs and recent error logs."
          runbook_url: "docs/runbooks/export-queue-backlog.md"
