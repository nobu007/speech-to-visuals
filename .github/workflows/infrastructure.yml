name: Infrastructure CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v4

    - name: Validate YAML files
      run: |
        find . -name "*.yml" -o -name "*.yaml" | xargs -I {} sh -c 'echo "Validating {}" && python -c "import yaml; yaml.safe_load(open(\"{}\"))"'

    - name: Validate JSON files
      run: |
        # tsconfig*.json are JSONC by TypeScript design (comments + trailing
        # commas) — strict json.load rejects them. Their syntax is validated by
        # the type-check job (tsc) instead, so they are excluded here.
        find . -name "*.json" -not -path "./node_modules/*" -not -path "./.git/*" -not -name "tsconfig*.json" \
          | xargs -I {} sh -c 'echo "Validating {}" && python -c "import json; json.load(open(\"{}\"))"'

  monitoring-schema-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: validate
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: npm
    - run: npm ci
    - name: Validate monitoring config schemas
      run: npx tsx scripts/validate-monitoring-configs.ts

  deploy:
    needs: [validate, monitoring-schema-validate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
    - uses: actions/checkout@v4

    - name: Deploy configuration
      run: |
        echo "Configuration deployment would happen here"
