name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Documented timeout targets (minutes):
#   Fast jobs (lint, type-check, code-size-audit): 10
#   Test shards: 15 (per shard; 4 shards run in parallel)
#   Standard jobs (build): 30
#   Heavy jobs (security-fuzz): 45
#   Gate job: 3
# REQ-254: timeout-minutes is set on every job, and ELAPSED is tracked
# with an assertion that fails the gate job if any job exceeds its budget
# (test shards enforce their budget in-job with a hard fail).

# @stv/core is a git dependency; the lockfile may record it as git+ssh://
# (developer machines rewrite https→ssh via insteadOf). CI has no SSH keys,
# so rewrite ssh→https for anonymous clones of the public repo instead.
env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: url.https://github.com/.insteadOf
  GIT_CONFIG_VALUE_0: ssh://git@github.com/

jobs:
  code-size-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run code size audit
        id: audit
        run: |
          START=$(date +%s)
          npm run audit:code-size
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "elapsed_seconds=$ELAPSED" >> $GITHUB_OUTPUT
          THRESHOLD=480
          if [ "$ELAPSED" -gt "$THRESHOLD" ]; then
            echo "::warning::code-size-audit exceeded ${THRESHOLD}s (ELAPSED=${ELAPSED}s)"
            echo "budget_exceeded=true" >> $GITHUB_OUTPUT
          else
            echo "budget_exceeded=false" >> $GITHUB_OUTPUT
          fi
      - name: Write timing
        if: always()
        run: |
          mkdir -p timing
          printf 'job=code-size-audit\nelapsed_seconds=%s\nbudget_exceeded=%s\n' \
            "${{ steps.audit.outputs.elapsed_seconds }}" "${{ steps.audit.outputs.budget_exceeded }}" \
            > timing/code-size-audit.txt
      - name: Upload timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timing-code-size-audit
          retention-days: 1
          path: timing/

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run ESLint
        id: lint
        run: |
          START=$(date +%s)
          npm run lint
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "elapsed_seconds=$ELAPSED" >> $GITHUB_OUTPUT
          THRESHOLD=480
          if [ "$ELAPSED" -gt "$THRESHOLD" ]; then
            echo "::warning::lint exceeded ${THRESHOLD}s (ELAPSED=${ELAPSED}s)"
            echo "budget_exceeded=true" >> $GITHUB_OUTPUT
          else
            echo "budget_exceeded=false" >> $GITHUB_OUTPUT
          fi

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run type check
        id: typecheck
        run: |
          START=$(date +%s)
          npm run type-check
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "elapsed_seconds=$ELAPSED" >> $GITHUB_OUTPUT
          THRESHOLD=480
          if [ "$ELAPSED" -gt "$THRESHOLD" ]; then
            echo "::warning::type-check exceeded ${THRESHOLD}s (ELAPSED=${ELAPSED}s)"
            echo "budget_exceeded=true" >> $GITHUB_OUTPUT
          else
            echo "budget_exceeded=false" >> $GITHUB_OUTPUT
          fi

  # Test sharding: 4 parallel shard jobs each run ~1/4 of the suite. This is
  # the merge-loop critical path for autonomous development — wall-clock
  # feedback drops from ~12min (single job, maxWorkers-limited) to ~4-5min.
  # Coverage instrumentation is dropped here: no coverageThreshold is
  # configured anywhere, so --coverage never gated anything — it was pure
  # overhead. Run `npm run test:coverage` locally when numbers are needed.
  # REQ-254 budgets: each shard hard-fails its own 600s jest budget (simpler
  # and stronger than the old soft-warning + gate-assert pair; the aggregated
  # needs.test.result carries any shard failure into the gate job).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run tests (shard ${{ matrix.shard }}/4)
        id: test
        run: |
          START=$(date +%s)
          npm test -- --shard=${{ matrix.shard }}/4
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "elapsed_seconds=$ELAPSED" >> $GITHUB_OUTPUT
          THRESHOLD=600
          if [ "$ELAPSED" -gt "$THRESHOLD" ]; then
            echo "::error::test shard ${{ matrix.shard }} exceeded ${THRESHOLD}s (ELAPSED=${ELAPSED}s)"
            exit 1
          fi

  monitoring-config-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate monitoring configs
        id: monvalidate
        run: |
          START=$(date +%s)
          npx tsx scripts/validate-monitoring-configs.ts
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "elapsed_seconds=$ELAPSED" >> $GITHUB_OUTPUT
          THRESHOLD=480
          if [ "$ELAPSED" -gt "$THRESHOLD" ]; then
            echo "::warning::monitoring-config-validate exceeded ${THRESHOLD}s (ELAPSED=${ELAPSED}s)"
            echo "budget_exceeded=true" >> $GITHUB_OUTPUT
          else
            echo "budget_exceeded=false" >> $GITHUB_OUTPUT
          fi

  monitoring-drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check monitoring drift
        id: mondrift
        run: |
          START=$(date +%s)
          npx tsx scripts/check-monitoring-drift.ts
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "elapsed_seconds=$ELAPSED" >> $GITHUB_OUTPUT
          THRESHOLD=480
          if [ "$ELAPSED" -gt "$THRESHOLD" ]; then
            echo "::warning::monitoring-drift-check exceeded ${THRESHOLD}s (ELAPSED=${ELAPSED}s)"
            echo "budget_exceeded=true" >> $GITHUB_OUTPUT
          else
            echo "budget_exceeded=false" >> $GITHUB_OUTPUT
          fi

  spine-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate spine manifest
        id: spine
        run: |
          START=$(date +%s)
          npm run spine:validate
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "elapsed_seconds=$ELAPSED" >> $GITHUB_OUTPUT
          THRESHOLD=240
          if [ "$ELAPSED" -gt "$THRESHOLD" ]; then
            echo "::warning::spine-validate exceeded ${THRESHOLD}s (ELAPSED=${ELAPSED}s)"
            echo "budget_exceeded=true" >> $GITHUB_OUTPUT
          else
            echo "budget_exceeded=false" >> $GITHUB_OUTPUT
          fi

  # REQ-2148 / TC-313 — the Supabase Edge sanitizer copy
  # (supabase/functions/_shared/untrusted-json.ts) is a GENERATED build artifact
  # from the single source of truth src/analysis/untrusted-json-core.ts. Deno
  # (the Edge runtime) cannot import the client src/ tree, and the ideal
  # collapse — publish the core to a version-pinned Deno URL (jsr.io /
  # deno.land/x) and import it via https:// — is blocked on CI network-import
  # stabilization. This gate is the unblocked enforcement path the ticket asks
  # for: CI regenerates the copy IN MEMORY from the core (`verify:edge`) and
  # fails on any drift. It is the env-independent codegen --check path (no
  # jest/ts-jest runtime), mirroring scripts/hooks/pre-commit, so copy-freshness
  # is a first-class, fast, drift-only check instead of being witnessed only
  # transitively inside the long-running `test` job. The behavioral jest guards
  # TC-312/TC-313 remain in `test` as belt-and-suspenders.
  #
  # REQ-2148 "CI regenerates AND verifies": this job is the *verifies* half. The
  # *regenerates* half is the `prebuild` npm hook (`npm run sync:edge`) that fires
  # inside the `build` job below, so a built/deployed Edge artifact is always
  # freshly derived from the core, not just drift-checked. Source-anchored by
  # tests/guards/edge-untrusted-json-sync.test.ts (TC-313 prebuild wiring).
  edge-sanitizer-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify Edge sanitizer copy is regenerated from core (TC-313)
        id: edge_sync
        run: |
          START=$(date +%s)
          npm run --silent verify:edge
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "elapsed_seconds=$ELAPSED" >> $GITHUB_OUTPUT
          THRESHOLD=240
          if [ "$ELAPSED" -gt "$THRESHOLD" ]; then
            echo "::warning::edge-sanitizer-sync exceeded ${THRESHOLD}s (ELAPSED=${ELAPSED}s)"
            echo "budget_exceeded=true" >> $GITHUB_OUTPUT
          else
            echo "budget_exceeded=false" >> $GITHUB_OUTPUT
          fi

  # No `needs` below: ordering test→build→fuzz bought nothing (same runner
  # pool, free parallel jobs on public repos) and put build+fuzz behind the
  # slowest job on the critical path. The all-checks-pass gate still requires
  # every job to pass before merge.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run build
        id: build
        run: |
          START=$(date +%s)
          npm run build
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "elapsed_seconds=$ELAPSED" >> $GITHUB_OUTPUT
          THRESHOLD=1740
          if [ "$ELAPSED" -gt "$THRESHOLD" ]; then
            echo "::warning::build exceeded ${THRESHOLD}s (ELAPSED=${ELAPSED}s)"
            echo "budget_exceeded=true" >> $GITHUB_OUTPUT
          else
            echo "budget_exceeded=false" >> $GITHUB_OUTPUT
          fi

  security-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run multi-seed security fuzz tests
        id: fuzz
        env:
          FUZZ_SEEDS: 3
        run: |
          START=$(date +%s)
          npm run test:fuzz:multi-seed
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "elapsed_seconds=$ELAPSED" >> $GITHUB_OUTPUT
          THRESHOLD=2400
          if [ "$ELAPSED" -gt "$THRESHOLD" ]; then
            echo "::warning::security-fuzz exceeded ${THRESHOLD}s (ELAPSED=${ELAPSED}s)"
            echo "budget_exceeded=true" >> $GITHUB_OUTPUT
          else
            echo "budget_exceeded=false" >> $GITHUB_OUTPUT
          fi
      - name: Run red-phase verification gate
        run: ./scripts/verify-red-phase.sh

  # Gate job — blocks PR merge if any required job fails.
  # REQ-254: Also asserts that no job exceeded its time budget.
  # Add this as a required status check in GitHub branch protection settings.
  all-checks-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [code-size-audit, lint, type-check, test, monitoring-config-validate, monitoring-drift-check, spine-validate, edge-sanitizer-sync, build, security-fuzz]
    if: always()
    steps:
      - name: Check all required jobs passed
        if: ${{ !((needs.code-size-audit.result == 'success') && (needs.lint.result == 'success') && (needs.type-check.result == 'success') && (needs.test.result == 'success') && (needs.monitoring-config-validate.result == 'success') && (needs.monitoring-drift-check.result == 'success') && (needs.spine-validate.result == 'success') && (needs.edge-sanitizer-sync.result == 'success') && (needs.build.result == 'success') && (needs.security-fuzz.result == 'success')) }}
        run: |
          echo "One or more required checks failed:"
          echo "  code-size-audit: ${{ needs.code-size-audit.result }}"
          echo "  lint: ${{ needs.lint.result }}"
          echo "  type-check: ${{ needs.type-check.result }}"
          echo "  test: ${{ needs.test.result }}"
          echo "  monitoring-config-validate: ${{ needs.monitoring-config-validate.result }}"
          echo "  monitoring-drift-check: ${{ needs.monitoring-drift-check.result }}"
          echo "  spine-validate: ${{ needs.spine-validate.result }}"
          echo "  edge-sanitizer-sync: ${{ needs.edge-sanitizer-sync.result }}"
          echo "  build: ${{ needs.build.result }}"
          echo "  security-fuzz: ${{ needs.security-fuzz.result }}"
          exit 1
      - name: Assert no job exceeded time budget (REQ-254)
        run: |
          # Enforce budget_exceeded flags: if any job exceeded its time budget,
          # the gate fails. This converts informational warnings into hard failures.
          BUDGET_FAILURES=""
          check_budget() {
            local job="$1"
            local exceeded="$2"
            if [ "$exceeded" = "true" ]; then
              BUDGET_FAILURES="$BUDGET_FAILURES $job"
            fi
          }
          check_budget "code-size-audit" "${{ needs.code-size-audit.outputs.budget_exceeded }}"
          check_budget "lint" "${{ needs.lint.outputs.budget_exceeded }}"
          check_budget "type-check" "${{ needs.type-check.outputs.budget_exceeded }}"
          # test budget is enforced per-shard (hard fail) — see the test job.
          check_budget "monitoring-config-validate" "${{ needs.monitoring-config-validate.outputs.budget_exceeded }}"
          check_budget "monitoring-drift-check" "${{ needs.monitoring-drift-check.outputs.budget_exceeded }}"
          check_budget "spine-validate" "${{ needs.spine-validate.outputs.budget_exceeded }}"
          check_budget "edge-sanitizer-sync" "${{ needs.edge-sanitizer-sync.outputs.budget_exceeded }}"
          check_budget "build" "${{ needs.build.outputs.budget_exceeded }}"
          check_budget "security-fuzz" "${{ needs.security-fuzz.outputs.budget_exceeded }}"
          if [ -n "$BUDGET_FAILURES" ]; then
            echo "::error::Jobs exceeded their time budget:$BUDGET_FAILURES"
            echo "Time budget violations detected. Investigate performance regressions."
            exit 1
          fi
          echo "All required checks passed within their time budgets."
          echo "Timeout configuration verified per REQ-254."
      - name: All checks passed
        run: echo "All required checks passed"
