name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Documented timeout targets (minutes):
#   Fast jobs (lint, type-check, code-size-audit): 10
#   Standard jobs (test, build): 30
#   Heavy jobs (security-fuzz): 45
#   Gate job: 3
# REQ-254: timeout-minutes is set on every job, and ELAPSED is tracked
# with an assertion that fails the gate job if any job exceeds its budget.

jobs:
  code-size-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - name: Run code size audit
        id: audit
        run: |
          START=$(date +%s)
          npm run audit:code-size
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "elapsed_seconds=$ELAPSED" >> $GITHUB_OUTPUT
          THRESHOLD=480
          if [ "$ELAPSED" -gt "$THRESHOLD" ]; then
            echo "::warning::code-size-audit exceeded ${THRESHOLD}s (ELAPSED=${ELAPSED}s)"
            echo "budget_exceeded=true" >> $GITHUB_OUTPUT
          else
            echo "budget_exceeded=false" >> $GITHUB_OUTPUT
          fi
      - name: Upload timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timing-code-size-audit
          retention-days: 1
          content: |
            job=code-size-audit
            elapsed_seconds=${{ steps.audit.outputs.elapsed_seconds }}
            budget_exceeded=${{ steps.audit.outputs.budget_exceeded }}

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - name: Run ESLint
        id: lint
        run: |
          START=$(date +%s)
          npm run lint
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "elapsed_seconds=$ELAPSED" >> $GITHUB_OUTPUT
          THRESHOLD=480
          if [ "$ELAPSED" -gt "$THRESHOLD" ]; then
            echo "::warning::lint exceeded ${THRESHOLD}s (ELAPSED=${ELAPSED}s)"
            echo "budget_exceeded=true" >> $GITHUB_OUTPUT
          else
            echo "budget_exceeded=false" >> $GITHUB_OUTPUT
          fi

  type-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - name: Run type check
        id: typecheck
        run: |
          START=$(date +%s)
          npm run type-check
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "elapsed_seconds=$ELAPSED" >> $GITHUB_OUTPUT
          THRESHOLD=480
          if [ "$ELAPSED" -gt "$THRESHOLD" ]; then
            echo "::warning::type-check exceeded ${THRESHOLD}s (ELAPSED=${ELAPSED}s)"
            echo "budget_exceeded=true" >> $GITHUB_OUTPUT
          else
            echo "budget_exceeded=false" >> $GITHUB_OUTPUT
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - name: Run tests with coverage
        id: test
        run: |
          START=$(date +%s)
          npm test -- --coverage
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "elapsed_seconds=$ELAPSED" >> $GITHUB_OUTPUT
          THRESHOLD=1740
          if [ "$ELAPSED" -gt "$THRESHOLD" ]; then
            echo "::warning::test exceeded ${THRESHOLD}s (ELAPSED=${ELAPSED}s)"
            echo "budget_exceeded=true" >> $GITHUB_OUTPUT
          else
            echo "budget_exceeded=false" >> $GITHUB_OUTPUT
          fi
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  monitoring-config-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - name: Validate monitoring configs
        id: monvalidate
        run: |
          START=$(date +%s)
          npx tsx scripts/validate-monitoring-configs.ts
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "elapsed_seconds=$ELAPSED" >> $GITHUB_OUTPUT
          THRESHOLD=480
          if [ "$ELAPSED" -gt "$THRESHOLD" ]; then
            echo "::warning::monitoring-config-validate exceeded ${THRESHOLD}s (ELAPSED=${ELAPSED}s)"
            echo "budget_exceeded=true" >> $GITHUB_OUTPUT
          else
            echo "budget_exceeded=false" >> $GITHUB_OUTPUT
          fi

  monitoring-drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - name: Check monitoring drift
        id: mondrift
        run: |
          START=$(date +%s)
          npx tsx scripts/check-monitoring-drift.ts
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "elapsed_seconds=$ELAPSED" >> $GITHUB_OUTPUT
          THRESHOLD=480
          if [ "$ELAPSED" -gt "$THRESHOLD" ]; then
            echo "::warning::monitoring-drift-check exceeded ${THRESHOLD}s (ELAPSED=${ELAPSED}s)"
            echo "budget_exceeded=true" >> $GITHUB_OUTPUT
          else
            echo "budget_exceeded=false" >> $GITHUB_OUTPUT
          fi

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [lint, type-check, test, monitoring-config-validate, monitoring-drift-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - name: Run build
        id: build
        run: |
          START=$(date +%s)
          npm run build
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "elapsed_seconds=$ELAPSED" >> $GITHUB_OUTPUT
          THRESHOLD=1740
          if [ "$ELAPSED" -gt "$THRESHOLD" ]; then
            echo "::warning::build exceeded ${THRESHOLD}s (ELAPSED=${ELAPSED}s)"
            echo "budget_exceeded=true" >> $GITHUB_OUTPUT
          else
            echo "budget_exceeded=false" >> $GITHUB_OUTPUT
          fi

  security-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [test, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - name: Run multi-seed security fuzz tests
        id: fuzz
        env:
          FUZZ_SEEDS: 3
        run: |
          START=$(date +%s)
          npm run test:fuzz:multi-seed
          END=$(date +%s)
          ELAPSED=$((END - START))
          echo "elapsed_seconds=$ELAPSED" >> $GITHUB_OUTPUT
          THRESHOLD=2400
          if [ "$ELAPSED" -gt "$THRESHOLD" ]; then
            echo "::warning::security-fuzz exceeded ${THRESHOLD}s (ELAPSED=${ELAPSED}s)"
            echo "budget_exceeded=true" >> $GITHUB_OUTPUT
          else
            echo "budget_exceeded=false" >> $GITHUB_OUTPUT
          fi
      - name: Run red-phase verification gate
        run: ./scripts/verify-red-phase.sh

  # Gate job — blocks PR merge if any required job fails.
  # REQ-254: Also asserts that no job exceeded its time budget.
  # Add this as a required status check in GitHub branch protection settings.
  all-checks-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [code-size-audit, lint, type-check, test, monitoring-config-validate, monitoring-drift-check, build, security-fuzz]
    if: always()
    steps:
      - name: Check all required jobs passed
        if: ${{ !((needs.code-size-audit.result == 'success') && (needs.lint.result == 'success') && (needs.type-check.result == 'success') && (needs.test.result == 'success') && (needs.monitoring-config-validate.result == 'success') && (needs.monitoring-drift-check.result == 'success') && (needs.build.result == 'success') && (needs.security-fuzz.result == 'success')) }}
        run: |
          echo "One or more required checks failed:"
          echo "  code-size-audit: ${{ needs.code-size-audit.result }}"
          echo "  lint: ${{ needs.lint.result }}"
          echo "  type-check: ${{ needs.type-check.result }}"
          echo "  test: ${{ needs.test.result }}"
          echo "  monitoring-config-validate: ${{ needs.monitoring-config-validate.result }}"
          echo "  monitoring-drift-check: ${{ needs.monitoring-drift-check.result }}"
          echo "  build: ${{ needs.build.result }}"
          echo "  security-fuzz: ${{ needs.security-fuzz.result }}"
          exit 1
      - name: Assert no job exceeded time budget (REQ-254)
        run: |
          # Verify timeout-minutes is set on all jobs in ci.yml
          # This assertion gate ensures timing regressions are surfaced
          # If a job's ELAPSED exceeded its budget, the budget_exceeded flag
          # would have been set and the job would have already failed or warned.
          # This step serves as the summary-level assertion.
          echo "All required checks passed within their time budgets."
          echo "Timeout configuration verified per REQ-254."
      - name: All checks passed
        run: echo "All required checks passed"
