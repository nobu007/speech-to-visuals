name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  code-size-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run audit:code-size

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run lint

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run type-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm test -- --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  monitoring-config-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/validate-monitoring-configs.ts

  monitoring-drift-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/check-monitoring-drift.ts

  build:
    runs-on: ubuntu-latest
    needs: [lint, type-check, test, monitoring-config-validate, monitoring-drift-check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm run build

  security-fuzz:
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - name: Run multi-seed security fuzz tests
        env:
          FUZZ_SEEDS: 3
        run: npm run test:fuzz:multi-seed
      - name: Run red-phase verification gate
        run: ./scripts/verify-red-phase.sh

  # Gate job — blocks PR merge if any required job fails.
  # Add this as a required status check in GitHub branch protection settings.
  all-checks-pass:
    runs-on: ubuntu-latest
    needs: [code-size-audit, lint, type-check, test, monitoring-config-validate, monitoring-drift-check, build, security-fuzz]
    if: always()
    steps:
      - name: Check all required jobs passed
        if: ${{ !((needs.code-size-audit.result == 'success') && (needs.lint.result == 'success') && (needs.type-check.result == 'success') && (needs.test.result == 'success') && (needs.monitoring-config-validate.result == 'success') && (needs.monitoring-drift-check.result == 'success') && (needs.build.result == 'success') && (needs.security-fuzz.result == 'success')) }}
        run: |
          echo "One or more required checks failed:"
          echo "  code-size-audit: ${{ needs.code-size-audit.result }}"
          echo "  lint: ${{ needs.lint.result }}"
          echo "  type-check: ${{ needs.type-check.result }}"
          echo "  test: ${{ needs.test.result }}"
          echo "  monitoring-config-validate: ${{ needs.monitoring-config-validate.result }}"
          echo "  monitoring-drift-check: ${{ needs.monitoring-drift-check.result }}"
          echo "  build: ${{ needs.build.result }}"
          echo "  security-fuzz: ${{ needs.security-fuzz.result }}"
          exit 1
      - name: All checks passed
        run: echo "✅ All required checks passed"
